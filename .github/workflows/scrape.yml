name: Skrapa husvagnsannonser

on:
  schedule:
    # Högsäsong (juni-augusti): var 15:e minut, UTC.
    - cron: "*/15 * * 6-8 *"
    # Lågsäsong men öppet (april, maj, september, oktober): en gång i timmen.
    - cron: "0 * * 4,5,9,10 *"
    # November-mars: ingen schemaläggning alls = helt pausat.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kör skrapare
        id: scrape
        env:
          GHL_PRIVATE_INTEGRATION_TOKEN: ${{ secrets.GHL_PRIVATE_INTEGRATION_TOKEN }}
          TOMAS_GHL_CONTACT_ID: ${{ secrets.TOMAS_GHL_CONTACT_ID }}
          GHL_AGENT_EMAIL: jean-claude@mail.ducostudios.com
        run: node scripts/scrape.mjs

      - name: Committa och pusha om något ändrats
        run: |
          git config user.name "husvagn-quest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json feed.xml
          if git diff --cached --quiet; then
            echo "Inga förändringar i questlistan."
          else
            git commit -m "Uppdatera questlistan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
