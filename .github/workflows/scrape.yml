name: Skrapa husvagnsannonser

on:
  schedule:
    # En gång i timmen, hela året.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kör skrapare
        id: scrape
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/scrape.mjs

      - name: Committa och pusha om något ändrats
        run: |
          git config user.name "husvagn-quest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json feed.xml scrapelog.json
          if git diff --cached --quiet; then
            echo "Inga förändringar i questlistan."
          else
            git commit -m "Uppdatera questlistan $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
